[package]
name = "mini-loader"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "A minimal Linux loader for ELF executables and position-independent executables."
version = "1.2.2"
keywords = ["elf", "unix", "loader"]
categories = ["no-std", "os"]

[dependencies.cfg-if]
workspace = true

[dependencies.syscalls]
workspace = true

[dependencies.elf_loader]
workspace = true
default-features = false
features = ["use-syscall"]

[dependencies]
linked_list_allocator = { version = "0.10.6" }

[lib]
test = false
bench = false

[[bin]]
name = "mini-loader"
test = false
bench = false
