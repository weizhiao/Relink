    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Clang and LLVM execution time and instruction TLB misses by loader</dc:title>
    <dc:description>Relink with THP, default Relink and libloading (glibc). Commit e5a5b92, 2026-11-07, CPU 2. Execution times exclude loading and use 95% confidence intervals. Instruction TLB misses cover the whole worker and are averaged across two processes.</dc:description>
