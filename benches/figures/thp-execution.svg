    <dc:title>Relink THP — execution and instruction TLB misses</dc:title>
    <dc:description>System THP policy: always. Commit a451175, measured 2026-11-03. Execution: Criterion means and 95% confidence intervals, excluding loading and collapse. Clang and LLVM iTLB misses come from separate whole-process user-mode perf runs, including setup and validation. Three operations per process, two processes per case; no iTLB confidence intervals. Linear axes start at zero.</dc:description>
