name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.channel }}
    - env:
        TARGET: ${{ matrix.target }}
        CHANNEL: ${{ matrix.channel }}
        FEATURES: ${{ matrix.features }}
        OP: build
      run: sh ci/run.sh
    strategy:
      matrix:
        target: [ x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, riscv64gc-unknown-linux-gnu, loongarch64-unknown-linux-gnu]
        channel: [ stable ]
        features: [ "use-syscall", "use-syscall,lazy-binding" ]
        include:
          - target: x86_64-unknown-linux-gnu
            channel: 1.93.0
            features: "use-syscall"
          - target: x86_64-unknown-linux-gnu
            channel: 1.93.0
            features: "use-syscall,lazy-binding"
          - target: x86_64-unknown-linux-gnu
            channel: stable
            features: "libc"
          - target: x86_64-unknown-linux-gnu
            channel: stable
            features: "libc,lazy-binding"
          - target: x86_64-unknown-linux-gnu
            channel: stable
            features: "libc,version"
          - target: x86_64-unknown-linux-gnu
            channel: stable
            features: "libc,log"

  test-linking:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.channel }}
    - env:
        TARGET: ${{ matrix.target }}
        CHANNEL: ${{ matrix.channel }}
        FEATURES: ${{ matrix.features }}
        OP: test
      run: sh ci/run.sh
    strategy:
      matrix:
        target: [ x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, riscv64gc-unknown-linux-gnu, loongarch64-unknown-linux-gnu, i586-unknown-linux-gnu, arm-unknown-linux-gnueabihf]
        channel: [ stable ]
        features: [ "use-syscall", "use-syscall,lazy-binding" ]
        include:
          - target: x86_64-unknown-linux-gnu
            channel: stable
            features: "use-syscall,object"
          - target: x86_64-unknown-linux-gnu
            channel: stable
            features: "libc"

  test-mini-loader:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.channel }}
    - name: Set up QEMU and binfmt_misc
      uses: docker/setup-qemu-action@v4
      with:
        platforms: all
    - env:
        TARGET: ${{ matrix.target }}
        CHANNEL: ${{ matrix.channel }}
        ARGS: "target/native_exec"
        OP: run -r -p mini-loader -Zbuild-std=core,alloc,panic_abort
        MINI_LOADER: 1
      run: |
        rustup component add rust-src
        sh ci/run.sh
    strategy:
      matrix:
        target: [ x86_64-unknown-none]
        channel: [ nightly ]

  test-riscv64-object-relocation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
        components: rust-src
    - name: Install cross
      run: cargo +stable install --locked cross --git https://github.com/cross-rs/cross
    - name: Run RISC-V object relocation tests
      env:
        RUSTFLAGS: -C target-cpu=generic-rv64 -C target-feature=+m,+a,+f,+d,+c,+crt-static
        CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-cpu=generic-rv64 -C target-feature=+m,+a,+f,+d,+c,+crt-static
        CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
        CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_AR: riscv64-linux-gnu-ar
      run: >
        cross test -p elf_loader -Z build-std=std,panic_unwind
        --target riscv64gc-unknown-linux-gnu
        --no-default-features --features object,use-syscall
        --test relocator riscv64:: -- --nocapture

  test-xtensa-qemu:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      QEMU_VERSION: esp-develop-9.2.2-20260417
      QEMU_ARCHIVE: qemu-xtensa-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz
      QEMU_SHA256: 0eecb2a34a5586c0e59110f77b9343b7b336e82fdb0e1a30e1dc1bab8a547e35
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
    - name: Install Xtensa Rust toolchain
      uses: esp-rs/xtensa-toolchain@v1.7.0
      with:
        buildtargets: esp32
        ldproxy: false
        version: 1.95.0.0
    - name: Install espflash
      run: cargo +stable install espflash --locked --version 4.5.0
    - name: Install Espressif QEMU
      run: |
        sudo apt-get update
        sudo apt-get install --yes libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0
        curl --fail --location --silent --show-error \
          "https://github.com/espressif/qemu/releases/download/${QEMU_VERSION}/${QEMU_ARCHIVE}" \
          --output "${RUNNER_TEMP}/${QEMU_ARCHIVE}"
        echo "${QEMU_SHA256}  ${RUNNER_TEMP}/${QEMU_ARCHIVE}" | sha256sum --check
        mkdir "${RUNNER_TEMP}/qemu"
        tar --extract --xz --file "${RUNNER_TEMP}/${QEMU_ARCHIVE}" \
          --directory "${RUNNER_TEMP}/qemu" --strip-components=1
        echo "${RUNNER_TEMP}/qemu/bin" >> "${GITHUB_PATH}"
    - name: Run Xtensa QEMU example
      run: ./examples/xtensa-qemu/run.sh
    - name: Upload QEMU log
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: xtensa-qemu-log
        path: examples/xtensa-qemu/target/qemu.log
        if-no-files-found: ignore

  test-windows-loader:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
    - name: Run example
      run: cargo run -p windows-elf-loader --example from_memory

  bench:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.channel }}
    - env:
        TARGET: ${{ matrix.target }}
        CHANNEL: ${{ matrix.channel }}
        FEATURES: ${{ matrix.features }}
        OP: bench
      run: sh ci/run.sh
    strategy:
      matrix:
        target: [ x86_64-unknown-linux-gnu ]
        channel: [ stable ]
        features: [ "use-syscall" ]

  build-no-std:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
    - env:
        TARGET: x86_64-unknown-none
        CHANNEL: nightly
        OP: build
      run: sh ci/run.sh
